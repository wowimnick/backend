[pytest]
DJANGO_SETTINGS_MODULE = CEBackend.settings
python_files = tests.py test_*.py *_tests.py
filterwarnings =
    # Django 5.1+ exposes RemovedInDjango51Warning (5.0 used RemovedInDjango50Warning).
    ignore::django.utils.deprecation.RemovedInDjango51Warning
    ignore:min_value should be a Decimal:UserWarning:rest_framework.fields