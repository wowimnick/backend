name: Deploy Backend to Production

on:
  push:
    branches:
      - prod # Triggers ONLY on push to the 'prod' branch

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: classeasily-backend-staging
  ECS_CLUSTER: classeasily-prod-cluster
  ECS_SERVICE_WEB: classeasily-prod-web-service
  ECS_SERVICE_WORKER: classeasily-prod-worker-service
  ECS_TASK_DEFINITION: classeasily-prod-backend-task

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy to Fargate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download existing task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION }} --query taskDefinition > task-definition.json
      - name: Show task definition JSON
        run: |
          echo "--- Contents of task-definition.json ---"
          cat task-definition.json
          echo "------------------------------------"

      - name: Inject new image URI into task definition JSON
        id: task-def-json
        run: |
          # Use jq to update the 'image' field for both the 'web' and 'worker' containers.
          # Then, remove read-only fields that the register-task-definition API call rejects.
          jq --arg IMAGE_URI "${{ steps.build-image.outputs.image }}" '
          .containerDefinitions[0].image = $IMAGE_URI | 
          .containerDefinitions[1].image = $IMAGE_URI | 
          del(.taskDefinitionArn) | 
          del(.revision) | 
          del(.status) | 
          del(.requiresAttributes) | 
          del(.compatibilities) | 
          del(.registeredAt) | 
          del(.registeredBy) |
          del(.enableFaultInjection)
          ' task-definition.json > new-task-definition.json

          # Set the path of the new file as an output for the next step.
          echo "task_definition_path=new-task-definition.json" >> $GITHUB_OUTPUT

      - name: Deploy new task definition to ECS
        id: ecs-deploy
        run: |
          aws ecs register-task-definition --cli-input-json file://${{ steps.task-def-json.outputs.task_definition_path }}
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE_WEB }} --task-definition ${{ env.ECS_TASK_DEFINITION }} --force-new-deployment
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE_WORKER }} --task-definition ${{ env.ECS_TASK_DEFINITION }} --force-new-deployment

      # The aws-actions/amazon-ecs-deploy-task-definition action is no longer needed.
      # You can add a wait command here if you need it.
      - name: Wait for service stability
        run: |
          aws ecs wait services-stable --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE_WEB }}
