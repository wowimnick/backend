name: Django CI

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Display Python version and path
      run: |
        python --version
        which python
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install gunicorn
    - name: Display installed packages
      run: pip list
    - name: Verify boto3 installation
      run: |
        pip show boto3
        python -c "import boto3; print(boto3.__file__)"
    - name: Update Gunicorn service file
      run: |
        PYTHON_PATH=$(which python)
        SITE_PACKAGES=$(python -c "import site; print(site.getsitepackages()[0])")
        sudo tee /etc/systemd/system/gunicorn.service << EOF
        [Unit]
        Description=Gunicorn daemon for Django project
        After=network.target

        [Service]
        User=ubuntu
        Group=ubuntu
        WorkingDirectory=/home/ubuntu/actions-runner-b/_work/backend/backend
        Environment="PATH=$SITE_PACKAGES:$PATH"
        ExecStart=$PYTHON_PATH -m gunicorn --workers 3 --bind 127.0.0.1:8000 CEBackend.wsgi:application
        Restart=always

        [Install]
        WantedBy=multi-user.target
        EOF
        sudo systemctl daemon-reload
    - name: Verify Gunicorn configuration
      run: cat /etc/systemd/system/gunicorn.service
    - name: Run Django check
      run: python manage.py check
    - name: Run migrations
      run: python manage.py migrate
    - name: Restart Django application
      run: sudo systemctl restart gunicorn
    - name: Check Gunicorn status
      run: sudo systemctl status gunicorn
    - name: Check Django logs with full traceback
      run: sudo journalctl -u gunicorn -n 100 --no-pager
    - name: Wait for application to start
      run: |
        for i in {1..12}
        do
          if nc -z 127.0.0.1 8000; then
            echo "Application is running"
            exit 0
          fi
          echo "Waiting for application to start..."
          sleep 5
        done
        echo "Application failed to start"
        exit 1
    - name: Test Django API
      run: curl http://127.0.0.1:8000/api/