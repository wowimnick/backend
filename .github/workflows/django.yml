name: Django CI

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install gunicorn
    - name: Run migrations
      run: python manage.py migrate
    - name: Check current directory and list files
      run: |
        pwd
        ls -la
    - name: Create Gunicorn systemd service
      run: |
        sudo tee /etc/systemd/system/gunicorn.service << EOF
        [Unit]
        Description=Gunicorn daemon for Django project
        After=network.target

        [Service]
        User=ubuntu
        Group=ubuntu
        WorkingDirectory=$(pwd)
        ExecStart=$(which gunicorn) CEBackend.wsgi:application --bind 127.0.0.1:8000 --log-file=/home/ubuntu/gunicorn.log
        Restart=always

        [Install]
        WantedBy=multi-user.target
        EOF
    - name: Restart Django application
      run: |
        sudo systemctl daemon-reload
        sudo systemctl restart gunicorn
        sudo systemctl enable gunicorn
    - name: Check if Gunicorn is running
      run: |
        sleep 5
        sudo systemctl status gunicorn
        ps aux | grep gunicorn
        cat /home/ubuntu/gunicorn.log
    - name: Test Django API
      run: |
        curl http://127.0.0.1:8000/api/
