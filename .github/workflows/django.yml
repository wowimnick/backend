name: Django CI

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Display Python version and path
      run: |
        python --version
        which python
        echo "Python path:"
        python -c "import sys; print('\n'.join(sys.path))"
    - name: Display pip version and path
      run: |
        pip --version
        which pip
    - name: Display requirements.txt content
      run: cat requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install gunicorn
    - name: Display installed packages
      run: pip list
    - name: Verify boto3 installation
      run: |
        pip show boto3
        python -c "import boto3; print(boto3.__file__)"
    - name: Check Django settings
      run: |
        echo "INSTALLED_APPS contents:"
        grep -A 20 "INSTALLED_APPS" CEBackend/settings.py
        echo "AWS settings:"
        grep -i "aws" CEBackend/settings.py
    - name: Check for custom PYTHONPATH
      run: echo $PYTHONPATH
    - name: Verify Gunicorn configuration
      run: |
        cat /etc/systemd/system/gunicorn.service
        echo "Gunicorn executable path:"
        which gunicorn
    - name: Run Django check
      run: python manage.py check
    - name: Run migrations
      run: python manage.py migrate
    - name: Update Gunicorn service file
      run: |
        sudo sed -i 's#ExecStart=.*#ExecStart=$(which gunicorn) --workers 3 --bind 127.0.0.1:8000 CEBackend.wsgi:application#' /etc/systemd/system/gunicorn.service
        sudo systemctl daemon-reload
    - name: Restart Django application
      run: sudo systemctl restart gunicorn
    - name: Check Gunicorn status
      run: sudo systemctl status gunicorn
    - name: Check Django logs with full traceback
      run: sudo journalctl -u gunicorn -n 100 --no-pager
    - name: Wait for application to start
      run: |
        for i in {1..12}
        do
          if nc -z 127.0.0.1 8000; then
            echo "Application is running"
            exit 0
          fi
          echo "Waiting for application to start..."
          sleep 5
        done
        echo "Application failed to start"
        exit 1
    - name: Test Django API
      run: curl http://127.0.0.1:8000/api/