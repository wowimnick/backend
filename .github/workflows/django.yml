name: Deploy CEBackend to Production

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip" # Cache pip dependencies to speed up subsequent runs

      # --- NEW: Create .env.prod file from GitHub Secrets ---
      # This is the core of the secure secret management strategy.
      - name: Create Production Environment File
        run: |
          echo "--- Creating .env.prod file from secrets ---"
          # The DJANGO_ENV variable tells settings.py which mode we are in.
          echo "DJANGO_ENV=prod" > .env.prod

          # Append all other secrets. The '>>' is crucial.
          echo "DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" >> .env.prod
          echo "DEBUG=False" >> .env.prod
          echo "SITE_DOMAIN=${{ secrets.SITE_DOMAIN }}" >> .env.prod
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env.prod
          echo "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}" >> .env.prod
          echo "CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}" >> .env.prod
          echo "DB_ENGINE=${{ secrets.DB_ENGINE }}" >> .env.prod
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env.prod
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env.prod
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env.prod
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env.prod
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env.prod
          echo "CACHE_URL=${{ secrets.CACHE_URL }}" >> .env.prod
          echo "CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}" >> .env.prod
          echo "CELERY_RESULT_BACKEND=${{ secrets.CELERY_RESULT_BACKEND }}" >> .env.prod
          echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env.prod
          echo "DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}" >> .env.prod
          echo "RESEND_WEBHOOK_SECRET=${{ secrets.RESEND_WEBHOOK_SECRET }}" >> .env.prod
          echo "UNSUBSCRIBE_SECRET_KEY=${{ secrets.UNSUBSCRIBE_SECRET_KEY }}" >> .env.prod
          echo "STRIPE_PUBLIC_KEY=${{ secrets.STRIPE_PUBLIC_KEY }}" >> .env.prod
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env.prod
          echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> .env.prod
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env.prod
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env.prod
          echo "FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}" >> .env.prod
          echo "FACEBOOK_APP_SECRET=${{ secrets.FACEBOOK_APP_SECRET }}" >> .env.prod
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env.prod
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env.prod
          echo "AWS_STORAGE_BUCKET_NAME=${{ secrets.AWS_STORAGE_BUCKET_NAME }}" >> .env.prod
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env.prod
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env.prod
          echo "TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}" >> .env.prod
          echo "TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}" >> .env.prod
          echo "TWILIO_FROM_NUMBER=${{ secrets.TWILIO_FROM_NUMBER }}" >> .env.prod
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env.prod
          echo "AWS_SENDER_ID=${{ secrets.AWS_SENDER_ID }}" >> .env.prod

          echo "--- .env.prod file created successfully ---"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Best practice: daphne and celery should be in your requirements.txt
          pip install -r requirements.txt

      # --- MODIFIED: Ensure code is correct in the repo instead of patching it here ---
      # This step is a "code smell". The fix should be in your actual codebase.
      # If the fix is already in your `main` branch, you can remove this entire step.
      - name: Verify AppConfig (and optionally fix)
        run: |
          echo "Verifying that the correct AppConfig is used..."
          if grep -q "'quickstart'," CEBackend/settings.py; then
            echo "ERROR: Found obsolete 'quickstart' string in INSTALLED_APPS. Please fix your settings.py to use 'quickstart.apps.QuickstartConfig'."
            exit 1
          fi
          echo "AppConfig check passed."

      - name: Run Django Checks
        run: python manage.py check

      # --- NEW: Apply Database Migrations ---
      - name: Apply Database Migrations
        run: python manage.py migrate --noinput

      # --- NEW: Collect Static Files ---
      # This is crucial for serving static files from S3 in production.
      - name: Collect Static Files
        run: python manage.py collectstatic --noinput

      - name: Stop existing services
        run: |
          echo "Stopping services..."
          sudo systemctl stop gunicorn || true
          sudo systemctl stop django-asgi || true
          sudo systemctl stop celery-worker || true
          sudo systemctl stop celery-beat || true # Also stop beat if you use it

      # --- MODIFIED: Added EnvironmentFile directive to services ---
      - name: Create/Update systemd Service Files
        run: |
          PYTHON_PATH=$(which python)
          CURRENT_DIR=$(pwd)

          echo "Creating ASGI service file..."
          sudo tee /etc/systemd/system/django-asgi.service > /dev/null << EOF
          [Unit]
          Description=Django ASGI service with Daphne for CEBackend
          After=network.target

          [Service]
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=${CURRENT_DIR}
          # CRUCIAL: Load the .env.prod file
          EnvironmentFile=${CURRENT_DIR}/.env.prod
          ExecStart=${PYTHON_PATH} -m daphne -b 0.0.0.0 -p 8000 CEBackend.asgi:application
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
          EOF

          echo "Creating Celery Worker service file..."
          sudo tee /etc/systemd/system/celery-worker.service > /dev/null << EOF
          [Unit]
          Description=Celery Worker for CEBackend
          After=network.target redis.service

          [Service]
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=${CURRENT_DIR}
          # CRUCIAL: Load the .env.prod file
          EnvironmentFile=${CURRENT_DIR}/.env.prod
          ExecStart=${PYTHON_PATH} -m celery -A CEBackend worker --loglevel=INFO
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
          EOF

      - name: Reload systemd daemon and Restart Services
        run: |
          echo "Reloading systemd and restarting services..."
          sudo systemctl daemon-reload

          sudo systemctl enable django-asgi
          sudo systemctl restart django-asgi

          sudo systemctl enable celery-worker
          sudo systemctl restart celery-worker

      - name: Verify Service Status
        run: |
          echo "Waiting for services to initialize..."
          sleep 10

          echo "--- ASGI Service Status ---"
          sudo systemctl status django-asgi --no-pager || true

          echo "--- Celery Worker Status ---"
          sudo systemctl status celery-worker --no-pager || true

          # Health Check
          if ! sudo systemctl is-active --quiet django-asgi; then
              echo "❌ ASGI Service failed to start."
              sudo journalctl -u django-asgi -n 50 --no-pager
              exit 1
          fi

          if ! sudo systemctl is-active --quiet celery-worker; then
              echo "❌ Celery Worker failed to start."
              sudo journalctl -u celery-worker -n 50 --no-pager
              exit 1
          fi

          echo "✅ All services started successfully."
