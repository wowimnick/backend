name: Fix Django App Config and Setup ASGI

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Fix QuickStart AppConfig
        run: |
          # Create or update apps.py in the quickstart app
          mkdir -p quickstart
          cat > quickstart/apps.py << 'EOF'
          from django.apps import AppConfig
          import os

          class QuickstartConfig(AppConfig):
              name = 'quickstart'
              path = os.path.dirname(os.path.abspath(__file__))
              default_auto_field = 'django.db.models.BigAutoField'
          EOF
          
          # Make sure __init__.py exists
          touch quickstart/__init__.py
          
          # Update INSTALLED_APPS in settings.py to use the AppConfig
          sed -i "s/'quickstart',/'quickstart.apps.QuickstartConfig',/g" CEBackend/settings.py
          
          # Verify the change
          grep -A1 -B1 'QuickstartConfig' CEBackend/settings.py
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install daphne channels channels_redis
      
      - name: Stop existing services
        run: |
          sudo systemctl stop gunicorn || true
          sudo systemctl stop django-asgi || true
      
      - name: Create ASGI service file
        run: |
          PYTHON_PATH=$(which python)
          sudo tee /etc/systemd/system/django-asgi.service << EOF
          [Unit]
          Description=Django ASGI service with Daphne
          After=network.target redis.service
          
          [Service]
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=/home/ubuntu/actions-runner-b/_work/backend/backend
          Environment="PYTHONUNBUFFERED=1"
          ExecStart=${PYTHON_PATH} -m daphne --verbosity 2 -b 127.0.0.1 -p 8000 CEBackend.asgi:application
          StandardOutput=journal
          StandardError=journal
          Restart=on-failure
          RestartSec=10s
          
          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
      
      - name: Test ASGI setup
        run: |
          cd /home/ubuntu/actions-runner-b/_work/backend/backend
          python -c "from django.apps import apps; print('QuickstartConfig in apps:', 'quickstart.apps.QuickstartConfig' in [app.name for app in apps.get_app_configs()])"
          python -c "import os; from CEBackend.asgi import application; print('ASGI application imported successfully')"
      
      - name: Start Django ASGI application
        run: |
          sudo systemctl enable django-asgi
          sudo systemctl restart django-asgi
          sleep 5
          sudo systemctl status django-asgi
      
      - name: Wait for application to start
        run: |
          for i in {1..12}
          do
            if nc -z 127.0.0.1 8000; then
              echo "✅ Application is running successfully!"
              break
            fi
            echo "Waiting for application to start... ($i/12)"
            sleep 5
          done
          
          if nc -z 127.0.0.1 8000; then
            echo "✅ Application is running successfully!"
          else
            echo "❌ Application failed to start"
            sudo journalctl -u django-asgi -n 50 --no-pager
            exit 1
          fi
      
      - name: Configure Nginx for WebSockets
        run: |
          sudo tee -a /etc/nginx/sites-available/default << 'EOF'
          
          # WebSocket configuration
          location /ws/ {
              proxy_pass http://127.0.0.1:8000;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "Upgrade";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_read_timeout 86400;
          }
          EOF
          
          sudo nginx -t && sudo systemctl restart nginx
