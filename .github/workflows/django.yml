name: Deploy CEBackend to Production

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Create Production Environment File
        run: |
          echo "--- Creating .env.prod file from secrets using a heredoc ---"
          # Using a "here document" with a quoted delimiter ('EOF') is the safest way
          # to write secrets to a file, as it prevents any shell expansion or
          # interpretation of special characters within the block.
          cat << 'EOF' > .env.prod
          DJANGO_ENV=prod
          DJANGO_SECRET_KEY='${{ secrets.DJANGO_SECRET_KEY }}'
          DEBUG=False
          SITE_DOMAIN=${{ secrets.SITE_DOMAIN }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}
          DB_ENGINE=${{ secrets.DB_ENGINE }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER='${{ secrets.DB_USER }}'
          DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
          DB_HOST='${{ secrets.DB_HOST }}'
          DB_PORT=${{ secrets.DB_PORT }}
          CACHE_URL=${{ secrets.CACHE_URL }}
          CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}
          CELERY_RESULT_BACKEND=${{ secrets.CELERY_RESULT_BACKEND }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}
          STRIPE_PUBLIC_KEY=${{ secrets.STRIPE_PUBLIC_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_STORAGE_BUCKET_NAME=${{ secrets.AWS_STORAGE_BUCKET_NAME }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          EOF
          echo "--- .env.prod file created successfully ---"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- FIX: Set the environment for all Django commands ---
      - name: Run Django Checks
        env:
          DJANGO_ENV: prod
        run: python manage.py check

      - name: Apply Database Migrations
        env:
          DJANGO_ENV: prod
        run: python manage.py migrate --noinput

      - name: Collect Static Files
        env:
          DJANGO_ENV: prod
        run: python manage.py collectstatic --noinput --clear

      - name: Force Stop Existing Services and Free Port 8000
        run: |
          echo "--- Stopping systemd services ---"
          sudo systemctl stop django-asgi || true
          sudo systemctl stop celery-worker || true

          echo "--- Forcefully killing any process on port 8000 to prevent 'Address already in use' errors ---"
          # This is a safety net. The '|| true' ensures the workflow doesn't fail
          # if nothing is running on the port, which is the normal, expected case.
          sudo kill -9 $(sudo lsof -t -i:8000) || true

      - name: Create/Update systemd Service Files
        run: |
          PYTHON_PATH=$(which python)
          CURRENT_DIR=$(pwd)

          # The EnvironmentFile directive is the key for the long-running service
          sudo tee /etc/systemd/system/django-asgi.service > /dev/null << EOF
          [Unit]
          Description=Django ASGI service for CEBackend
          After=network.target
          [Service]
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=${CURRENT_DIR}
          EnvironmentFile=${CURRENT_DIR}/.env.prod
          ExecStart=${PYTHON_PATH} -m daphne -b 0.0.0.0 -p 8000 CEBackend.asgi:application
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target
          EOF

          sudo tee /etc/systemd/system/celery-worker.service > /dev/null << EOF
          [Unit]
          Description=Celery Worker for CEBackend
          After=network.target redis.service
          [Service]
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=${CURRENT_DIR}
          EnvironmentFile=${CURRENT_DIR}/.env.prod
          ExecStart=${PYTHON_PATH} -m celery -A CEBackend worker --loglevel=INFO
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target
          EOF

      - name: Reload systemd daemon and Restart Services
        run: |
          sudo systemctl daemon-reload
          sudo systemctl enable django-asgi celery-worker
          sudo systemctl restart django-asgi celery-worker

      - name: Verify Service Status
        run: |
          sleep 10 # Give services a moment to start
          echo "--- Verifying service statuses ---"
          if ! sudo systemctl is-active --quiet django-asgi; then
              echo "❌ ASGI Service failed to start."
              sudo journalctl -u django-asgi -n 50 --no-pager
              exit 1
          fi
          if ! sudo systemctl is-active --quiet celery-worker; then
              echo "❌ Celery Worker failed to start."
              sudo journalctl -u celery-worker -n 50 --no-pager
              exit 1
          fi
          echo "✅ All services are active."

      # --- NEW: Security Cleanup Step ---
      - name: Clean up secrets file
        if: always() # This step runs even if previous steps fail
        run: |
          echo "--- Removing secrets file for security ---"
          rm .env.prod
