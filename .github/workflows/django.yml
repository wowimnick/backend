name: Django CI

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Display Python version
      run: python --version
    - name: Display pip version
      run: pip --version
    - name: Display requirements.txt content
      run: cat requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install gunicorn
    - name: Display installed packages
      run: pip list
    - name: Check Django settings
      run: |
        grep "INSTALLED_APPS" CEBackend/settings.py
        grep "storages" CEBackend/settings.py
    - name: Run migrations
      run: python manage.py migrate
    - name: Restart Django application
      run: |
        sudo systemctl daemon-reload
        sudo systemctl restart gunicorn
    - name: Check Gunicorn status
      run: sudo systemctl status gunicorn
    - name: Check Django logs
      run: sudo journalctl -u gunicorn -n 50 --no-pager
    - name: Wait for application to start
      run: |
        for i in {1..12}
        do
          if nc -z 127.0.0.1 8000; then
            echo "Application is running"
            exit 0
          fi
          echo "Waiting for application to start..."
          sleep 5
        done
        echo "Application failed to start"
        exit 1
    - name: Test Django API
      run: curl http://127.0.0.1:8000/api/