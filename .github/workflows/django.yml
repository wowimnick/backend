name: Django CI with WebSockets Support

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install daphne channels channels_redis
      
      - name: Ensure Redis is running
        run: |
          sudo systemctl status redis || sudo systemctl start redis
          redis-cli ping
      
      - name: Check for port conflicts
        run: |
          sudo lsof -i:8000 || echo "Port 8000 is available"
          sudo fuser -k 8000/tcp || echo "No process using port 8000"
      
      - name: Test Daphne command directly
        run: |
          python -m daphne --help
          # Test run Daphne directly with proper verbosity
          cd /home/ubuntu/actions-runner-b/_work/backend/backend
          python -m daphne --verbosity 2 -b 127.0.0.1 -p 8001 CEBackend.asgi:application &
          DAPHNE_PID=$!
          sleep 5
          kill $DAPHNE_PID || true
      
      - name: Create ASGI service file with correct syntax
        run: |
          PYTHON_PATH=$(which python)
          sudo tee /etc/systemd/system/django-asgi.service << EOF
          [Unit]
          Description=Django ASGI service with Daphne
          After=network.target redis.service
          
          [Service]
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=/home/ubuntu/actions-runner-b/_work/backend/backend
          Environment="PYTHONUNBUFFERED=1"
          ExecStart=${PYTHON_PATH} -m daphne --verbosity 2 -b 127.0.0.1 -p 8000 CEBackend.asgi:application
          StandardOutput=journal
          StandardError=journal
          Restart=on-failure
          RestartSec=10s
          
          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
      
      - name: Stop existing services
        run: |
          sudo systemctl stop gunicorn || true
          sudo systemctl stop django-asgi || true
      
      - name: Start Django ASGI application
        run: |
          sudo systemctl enable django-asgi
          sudo systemctl restart django-asgi
          sleep 5
      
      - name: Check detailed logs
        run: |
          sudo systemctl status django-asgi
          sudo journalctl -xe -u django-asgi --no-pager
      
      - name: Try running ASGI directly as a foreground process if service fails
        if: failure()
        run: |
          echo "Running Daphne as a foreground process..."
          cd /home/ubuntu/actions-runner-b/_work/backend/backend
          nohup python -m daphne --verbosity 2 -b 127.0.0.1 -p 8000 CEBackend.asgi:application > daphne.log 2>&1 &
          sleep 10
          cat daphne.log
          curl -v http://127.0.0.1:8000/api/
