name: Deploy CEBackend to Production

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Create Production Environment File
        run: |
          echo "--- Creating .env.prod file from secrets ---"
          # This file will be loaded by settings.py when DJANGO_ENV=prod
          # It will also be loaded by the systemd services via EnvironmentFile
          echo "DJANGO_ENV=prod" > .env.prod
          echo "DJANGO_SECRET_KEY='${{ secrets.DJANGO_SECRET_KEY }}'" >> .env.prod
          echo "DEBUG=False" >> .env.prod
          echo "SITE_DOMAIN=${{ secrets.SITE_DOMAIN }}" >> .env.prod
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env.prod
          echo "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}" >> .env.prod
          echo "CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}" >> .env.prod
          echo "DB_ENGINE=${{ secrets.DB_ENGINE }}" >> .env.prod
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env.prod
          echo "DB_USER='${{ secrets.DB_USER }}'" >> .env.prod
          echo "DB_PASSWORD='${{ secrets.DB_PASSWORD }}'" >> .env.prod
          echo "DB_HOST='${{ secrets.DB_HOST }}'" >> .env.prod
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env.prod
          echo "CACHE_URL=${{ secrets.CACHE_URL }}" >> .env.prod
          echo "CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}" >> .env.prod
          echo "CELERY_RESULT_BACKEND=${{ secrets.CELERY_RESULT_BACKEND }}" >> .env.prod
          echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env.prod
          echo "DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}" >> .env.prod
          echo "STRIPE_PUBLIC_KEY=${{ secrets.STRIPE_PUBLIC_KEY }}" >> .env.prod
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env.prod
          echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> .env.prod
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env.prod
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env.prod
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env.prod
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env.prod
          echo "AWS_STORAGE_BUCKET_NAME=${{ secrets.AWS_STORAGE_BUCKET_NAME }}" >> .env.prod
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env.prod
          echo "--- .env.prod file created successfully ---"

      - name: Install psql and Attempt Direct DB Connection
        run: |
          echo "--- Installing PostgreSQL client ---"
          sudo apt-get update && sudo apt-get install -y postgresql-client

          echo "--- Loading credentials from .env.prod file ---"
          # Source the file to load variables into the shell environment
          # The 'set -a' command exports them automatically.
          set -a
          source .env.prod
          set +a

          echo "--- Attempting to connect directly to the database with psql... ---"
          echo "Host: $DB_HOST"
          echo "Port: $DB_PORT"
          echo "User: $DB_USER"
          echo "Database: $DB_NAME"
          # The PGPASSWORD environment variable is used by psql automatically.
          # The -c "\q" command tells psql to connect, run the quit command, and exit.
          # If the connection fails, it will return a non-zero exit code and fail the step.
          PGPASSWORD=$DB_PASSWORD psql --host=$DB_HOST --port=$DB_PORT --username=$DB_USER --dbname=$DB_NAME -c "\q"

          echo "--- ✅✅✅ DATABASE CONNECTION SUCCEEDED! ✅✅✅ ---"
          echo "If you see this message, the credentials and network are correct."

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- FIX: Set the environment for all Django commands ---
      - name: Run Django Checks
        env:
          DJANGO_ENV: prod
        run: python manage.py check

      - name: Apply Database Migrations
        env:
          DJANGO_ENV: prod
        run: python manage.py migrate --noinput

      - name: Collect Static Files
        env:
          DJANGO_ENV: prod
        run: python manage.py collectstatic --noinput

      - name: Stop existing services
        run: |
          sudo systemctl stop django-asgi || true
          sudo systemctl stop celery-worker || true

      - name: Create/Update systemd Service Files
        run: |
          PYTHON_PATH=$(which python)
          CURRENT_DIR=$(pwd)

          # The EnvironmentFile directive is the key for the long-running service
          sudo tee /etc/systemd/system/django-asgi.service > /dev/null << EOF
          [Unit]
          Description=Django ASGI service for CEBackend
          After=network.target
          [Service]
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=${CURRENT_DIR}
          EnvironmentFile=${CURRENT_DIR}/.env.prod
          ExecStart=${PYTHON_PATH} -m daphne -b 0.0.0.0 -p 8000 CEBackend.asgi:application
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target
          EOF

          sudo tee /etc/systemd/system/celery-worker.service > /dev/null << EOF
          [Unit]
          Description=Celery Worker for CEBackend
          After=network.target redis.service
          [Service]
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=${CURRENT_DIR}
          EnvironmentFile=${CURRENT_DIR}/.env.prod
          ExecStart=${PYTHON_PATH} -m celery -A CEBackend worker --loglevel=INFO
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target
          EOF

      - name: Reload systemd daemon and Restart Services
        run: |
          sudo systemctl daemon-reload
          sudo systemctl enable django-asgi celery-worker
          sudo systemctl restart django-asgi celery-worker

      - name: Verify Service Status
        run: |
          sleep 10 # Give services a moment to start
          echo "--- Verifying service statuses ---"
          if ! sudo systemctl is-active --quiet django-asgi; then
              echo "❌ ASGI Service failed to start."
              sudo journalctl -u django-asgi -n 50 --no-pager
              exit 1
          fi
          if ! sudo systemctl is-active --quiet celery-worker; then
              echo "❌ Celery Worker failed to start."
              sudo journalctl -u celery-worker -n 50 --no-pager
              exit 1
          fi
          echo "✅ All services are active."

      # --- NEW: Security Cleanup Step ---
      - name: Clean up secrets file
        if: always() # This step runs even if previous steps fail
        run: |
          echo "--- Removing secrets file for security ---"
          rm .env.prod
