name: Django CI with WebSockets Support

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Display Python version and path
        run: |
          python --version
          which python
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install daphne channels_redis  # Add ASGI server and Redis support
      
      - name: Display installed packages
        run: pip list
      
      - name: Verify boto3 installation
        run: |
          pip show boto3
          python -c "import boto3; print(boto3.__file__)"
      
      - name: Ensure Redis is running
        run: |
          sudo systemctl status redis || sudo systemctl start redis
          redis-cli ping  # Should return PONG
      
      - name: Create ASGI service file
        run: |
          PYTHON_PATH=$(which python)
          SITE_PACKAGES=$(python -c "import site; print(site.getsitepackages()[0])")
          sudo tee /etc/systemd/system/django-asgi.service << EOF
          [Unit]
          Description=Django ASGI service with Daphne
          After=network.target redis.service
          
          [Service]
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=/home/ubuntu/actions-runner-b/_work/backend/backend
          Environment="PATH=$SITE_PACKAGES:$PATH"
          ExecStart=$PYTHON_PATH -m daphne -b 127.0.0.1 -p 8000 CEBackend.asgi:application
          Restart=always
          
          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
      
      - name: Verify ASGI configuration
        run: cat /etc/systemd/system/django-asgi.service
      
      - name: Run Django check
        run: python manage.py check
      
      - name: Run migrations
        run: python manage.py migrate
      
      - name: Stop Gunicorn (if running)
        run: sudo systemctl stop gunicorn || true
      
      - name: Start/Restart Django ASGI application
        run: |
          sudo systemctl enable django-asgi
          sudo systemctl restart django-asgi
      
      - name: Check ASGI service status
        run: sudo systemctl status django-asgi
      
      - name: Check Django logs with full traceback
        run: sudo journalctl -u django-asgi -n 100 --no-pager
      
      - name: Wait for application to start
        run: |
          for i in {1..12}
          do
            if nc -z 127.0.0.1 8000; then
              echo "Application is running"
              exit 0
            fi
            echo "Waiting for application to start... ($i/12)"
            sleep 5
          done
          echo "Application failed to start"
          exit 1
      
      - name: Test Django API
        run: curl http://127.0.0.1:8000/api/
      
      - name: Verify WebSocket endpoint is available
        run: |
          # This command should attempt a WebSocket connection
          # It will exit with a connection error but should not get HTTP error
          timeout 5 curl --include --no-buffer -H "Connection: Upgrade" -H "Upgrade: websocket" -H "Sec-WebSocket-Key: SGVsbG8sIHdvcmxkIQ==" -H "Sec-WebSocket-Version: 13" http://127.0.0.1:8000/ws/system_metrics/ || true
          echo "WebSocket endpoint check completed"
      
      - name: Update Nginx configuration (if needed)
        run: |
          # Only modify if the WebSocket configuration is missing
          if ! grep -q "proxy_set_header Upgrade \$http_upgrade" /etc/nginx/sites-available/default; then
            sudo tee -a /etc/nginx/sites-available/default << EOF
            
            # WebSocket configuration
            location /ws/ {
                proxy_pass http://127.0.0.1:8000;
                proxy_http_version 1.1;
                proxy_set_header Upgrade \$http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_read_timeout 86400;
            }
            EOF
            
            sudo nginx -t && sudo systemctl restart nginx
          else
            echo "Nginx already configured for WebSockets"
          fi
