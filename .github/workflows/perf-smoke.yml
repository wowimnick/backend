# Optional CI perf smoke: requires Postgres + PostGIS (same stack as production models).
# Run locally: pytest quickstart/tests/perf/ -q
# PR comment step runs only on pull_request from forks with permissions.

name: perf-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "quickstart/**"
      - "CEBackend/**"
      - "requirements.txt"
      - "scripts/capture_endpoint_snapshots.py"
      - "scripts/diff_snapshots.py"
      - ".github/workflows/perf-smoke.yml"

jobs:
  perf-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_ce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      IS_DOCKER: "true"
      DJANGO_SECRET_KEY: ci-perf-smoke-secret-key-not-for-prod-00000000
      DJANGO_ENV: local
      DEBUG: "False"
      RESEND_API_KEY: re_ci_dummy
      GOOGLE_CLIENT_ID: "000"
      GOOGLE_CLIENT_SECRET: "000"
      STRIPE_PUBLIC_KEY: pk_test_ci
      STRIPE_SECRET_KEY: sk_test_ci
      GEMINI_API_KEY: ci_dummy
      OPENROUTER_API_KEY: ci_dummy
      VERCEL_AUTOMATION_BYPASS_SECRET: ci_dummy
      AWS_STORAGE_BUCKET_NAME: ci-dummy-bucket
      DB_ENGINE: django.contrib.gis.db.backends.postgis
      DB_NAME: test_ce
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Perf tests (query + latency budgets)
        run: pytest quickstart/tests/perf/test_endpoint_perf.py -q --maxfail=15

      - name: PR comment (summary)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**perf-smoke** workflow finished. See Actions logs for per-endpoint timing and query caps (`quickstart/tests/perf/`).',
            });
