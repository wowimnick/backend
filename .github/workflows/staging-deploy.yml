name: Deploy Staging to EC2

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: classeasily-backend-staging

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy to Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to EC2 instance
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USERNAME }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script: |
            # --- PREPARATION ---
            cat << 'EOF' > /home/ec2-user/.env.staging
            # --- Meta ---
            IS_DOCKER=true
            DJANGO_ENV=staging

            # --- Core & Security ---
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DEBUG=False
            SITE_DOMAIN=${{ secrets.STAGING_EC2_HOST }}
            ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
            CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}
            SECURE_SSL_REDIRECT=${{ secrets.SECURE_SSL_REDIRECT }}
            REVALIDATION_SECRET=${{ secrets.REVALIDATION_SECRET }}
            VERCEL_AUTOMATION_BYPASS_SECRET=${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            META_CAPI_ENABLED=${{ secrets.META_CAPI_ENABLED }}
            META_CAPI_TEST_EVENT_CODE=${{ secrets.META_CAPI_TEST_EVENT_CODE }}
            META_PIXEL_ID=${{ secrets.META_PIXEL_ID }}
            META_CAPI_ACCESS_TOKEN=${{ secrets.META_CAPI_ACCESS_TOKEN }}

            # --- Database, Cache, S3, etc. ---
            DB_ENGINE=${{ secrets.DB_ENGINE }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            CACHE_URL=${{ secrets.CACHE_URL }}
            CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}
            CELERY_RESULT_BACKEND=${{ secrets.CELERY_RESULT_BACKEND }}

            # --- Typesense (search engine; container hostname `typesense` on classeasily-net) ---
            TYPESENSE_HOST=typesense
            TYPESENSE_PORT=8108
            TYPESENSE_PROTOCOL=http
            TYPESENSE_API_KEY=${{ secrets.TYPESENSE_API_KEY }}
            TYPESENSE_COLLECTION_ALIAS=classes_live
            TYPESENSE_AUTO_BOOTSTRAP=true
            AWS_STORAGE_BUCKET_NAME=${{ secrets.AWS_STORAGE_BUCKET_NAME }}
            AWS_S3_REGION_NAME=${{ secrets.AWS_S3_REGION_NAME }}
            CLOUDFRONT_DOMAIN=${{ secrets.CLOUDFRONT_DOMAIN }}
            AWS_SNS_REGION=${{ secrets.AWS_SNS_REGION }}
            AWS_SMS_ENABLED=${{ secrets.AWS_SMS_ENABLED }}

            # --- API & Service Keys (Including Stripe) ---
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            TYPESENSE_API_KEY=${{ secrets.TYPESENSE_API_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            STRIPE_PUBLIC_KEY=${{ secrets.STRIPE_PUBLIC_KEY }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_CONNECT_WEBHOOK_SECRET=${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}
            STRIPE_PAYMENTS_WEBHOOK_SECRET=${{ secrets.STRIPE_PAYMENTS_WEBHOOK_SECRET }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            WIDGET_SUBSCRIPTION_REQUIRED=${{ secrets.WIDGET_SUBSCRIPTION_REQUIRED }}
            WIDGET_SUBSCRIPTION_PRICE_ADVANCED=${{ secrets.WIDGET_SUBSCRIPTION_PRICE_ADVANCED }}
            WIDGET_SUBSCRIPTION_PRICE_GROWTH=${{ secrets.WIDGET_SUBSCRIPTION_PRICE_GROWTH }}
            WIDGET_SUBSCRIPTION_PRICE_BASIC=${{ secrets.WIDGET_SUBSCRIPTION_PRICE_BASIC }}
            MARKETPLACE_EMAIL_ADDON_PRICE_ID=${{ secrets.MARKETPLACE_EMAIL_ADDON_PRICE_ID }}
            
            EMAIL_MARKETING_STARTER_PRICE_ID=${{ secrets.EMAIL_MARKETING_STARTER_PRICE_ID }}
            EMAIL_MARKETING_GROWTH_PRICE_ID=${{ secrets.EMAIL_MARKETING_GROWTH_PRICE_ID }}
            EMAIL_MARKETING_BUSINESS_PRICE_ID=${{ secrets.EMAIL_MARKETING_BUSINESS_PRICE_ID }}
            EMAIL_MARKETING_SCALE_PRICE_ID=${{ secrets.EMAIL_MARKETING_SCALE_PRICE_ID }}
            
            # --- Email & Frontend ---
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}
            EOF
            TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
            INSTANCE_PRIVATE_IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4)
            INSTANCE_PUBLIC_IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/public-ipv4)
            sed -i "s/^ALLOWED_HOSTS=.*/ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }},$INSTANCE_PRIVATE_IP,$INSTANCE_PUBLIC_IP,localhost,web/" /home/ec2-user/.env.staging

            # --- DEPLOYMENT LOGIC ---
            IMAGE_NAME=${{ steps.build-image.outputs.image }}
            WEB_CONTAINER_NAME="web"
            WORKER_CONTAINER_NAME="worker"
            STRIPE_PAYMENTS_CONTAINER_NAME="stripe-cli-payments"
            STRIPE_CONNECT_CONTAINER_NAME="stripe-cli-connect"
            NETWORK_NAME="classeasily-net"
            ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}

            # 1. AUTHENTICATE & PULL
            echo "--- Logging into Amazon ECR... ---"
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY
            echo "--- Pulling new image: $IMAGE_NAME ---"
            docker pull $IMAGE_NAME

            # 2. SETUP DOCKER NETWORK
            echo "--- Ensuring Docker network '$NETWORK_NAME' exists... ---"
            docker network create $NETWORK_NAME || true

            # 2b. TYPESENSE (persistent volume; not restarted on app deploy)
            TYPESENSE_CONTAINER_NAME="typesense"
            TYPESENSE_VOLUME="classeasily-typesense-data"
            docker volume create "$TYPESENSE_VOLUME" || true
            if [ -n "${{ secrets.TYPESENSE_API_KEY }}" ]; then
              if docker ps -a --format '{{.Names}}' | grep -qx "$TYPESENSE_CONTAINER_NAME"; then
                echo "--- Starting existing Typesense container... ---"
                docker start "$TYPESENSE_CONTAINER_NAME" || true
                docker network connect "$NETWORK_NAME" "$TYPESENSE_CONTAINER_NAME" 2>/dev/null || true
              else
                echo "--- Creating Typesense container... ---"
                docker run -d --restart unless-stopped \
                  --name "$TYPESENSE_CONTAINER_NAME" \
                  --network "$NETWORK_NAME" \
                  -p 127.0.0.1:8108:8108 \
                  -v "$TYPESENSE_VOLUME:/data" \
                  -e TYPESENSE_DATA_DIR=/data \
                  -e TYPESENSE_API_KEY="${{ secrets.TYPESENSE_API_KEY }}" \
                  -e TYPESENSE_ENABLE_CORS=true \
                  typesense/typesense:26.0
              fi
              echo "--- Waiting for Typesense HTTP... ---"
              for i in $(seq 1 45); do
                if curl -sf http://127.0.0.1:8108/health >/dev/null 2>&1; then
                  echo "--- Typesense healthy ---"
                  break
                fi
                sleep 1
              done
            else
              echo "--- WARNING: TYPESENSE_API_KEY GitHub secret unset; skipping Typesense container. ---"
            fi

            # 3. STOP AND REMOVE OLD CONTAINERS
            echo "--- Stopping all old containers... ---"
            docker stop $WEB_CONTAINER_NAME $WORKER_CONTAINER_NAME $STRIPE_PAYMENTS_CONTAINER_NAME $STRIPE_CONNECT_CONTAINER_NAME || true
            docker rm $WEB_CONTAINER_NAME $WORKER_CONTAINER_NAME $STRIPE_PAYMENTS_CONTAINER_NAME $STRIPE_CONNECT_CONTAINER_NAME || true

            # 4. START NEW APPLICATION CONTAINERS
            echo "--- Starting new web and worker containers... ---"
            docker run -d --rm --env-file /home/ec2-user/.env.staging -e CONTAINER_ROLE=web -p 80:8000 --name $WEB_CONTAINER_NAME --network $NETWORK_NAME $IMAGE_NAME uvicorn CEBackend.asgi:application --host 0.0.0.0 --port 8000 --workers 2 --lifespan off
            docker run -d --rm --env-file /home/ec2-user/.env.staging -e CONTAINER_ROLE=worker --name $WORKER_CONTAINER_NAME --network $NETWORK_NAME $IMAGE_NAME /usr/bin/supervisord -n

            # 5. START THE STRIPE CLI SIDECAR CONTAINERS (No changes here)
            echo "--- Starting Stripe CLI for Payments Webhook... ---"
            docker run -d --rm --name $STRIPE_PAYMENTS_CONTAINER_NAME --network $NETWORK_NAME stripe/stripe-cli:latest listen --api-key "${{ secrets.STRIPE_SECRET_KEY }}" --forward-to "http://web:8000/api/payments/webhook/" --events "payment_intent.succeeded,payment_intent.payment_failed,invoice.paid,invoice.payment_failed,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted"

            echo "--- Starting Stripe CLI for Connect Webhook... ---"
            docker run -d --rm --name $STRIPE_CONNECT_CONTAINER_NAME --network $NETWORK_NAME stripe/stripe-cli:latest listen --api-key "${{ secrets.STRIPE_SECRET_KEY }}" --forward-to "http://web:8000/api/webhooks/stripe-connect/" --events "account.updated,capability.updated,transfer.created"

            # 6. VERIFY AND LOG (No changes here)
            echo "--- Waiting 5 seconds for containers to boot... ---"
            sleep 5
            echo "--- ✅ Deployment containers started. Tailing final logs for 15 seconds... ---"
            timeout 15s docker logs --follow $WEB_CONTAINER_NAME &
            timeout 15s docker logs --follow $WORKER_CONTAINER_NAME &
            timeout 15s docker logs --follow $STRIPE_CONNECT_CONTAINER_NAME &
            wait

            # 7. CLEANUP
            echo "--- Pruning unused Docker images... ---"
            docker image prune -a -f
            echo "--- ✅ Deployment script finished successfully. ---"
