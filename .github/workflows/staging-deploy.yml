name: Deploy Staging to EC2

on:
  push:
    branches:
      - main # This workflow runs when you push to the 'main' branch

# Environment variables available to all jobs
env:
  AWS_REGION: us-east-2 # <-- IMPORTANT: Change to your AWS region
  ECR_REPOSITORY: classeasily-backend-staging # <-- Your ECR repository name

# Permissions needed for OIDC connection
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy to Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }} # Use the unique commit SHA as the image tag
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ==========================================================
      # ==      UPDATED DEPLOYMENT STEP - NO MANUAL SETUP       ==
      # ==========================================================
      - name: Deploy to EC2 instance
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USERNAME }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script: |
            TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")

            # Step 2: Use the session token to securely fetch the instance's private IP.
            INSTANCE_PRIVATE_IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4)

            # Step 3: Combine the GitHub secret and the fetched IP into a new variable.
            COMBINED_ALLOWED_HOSTS="${{ secrets.ALLOWED_HOSTS }},${INSTANCE_PRIVATE_IP}"

            # This comment is outside the EOF block, so it's fine.
            # The following block creates the .env.staging file on the server.

            cat << 'EOF' > /home/ec2-user/.env.staging
            # --- Meta ---
            IS_DOCKER=true
            DJANGO_ENV=staging

            # --- Core & Security ---
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DEBUG=False
            SITE_DOMAIN=${{ secrets.STAGING_EC2_HOST }}
            ALLOWED_HOSTS=${COMBINED_ALLOWED_HOSTS}
            CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}

            # --- Database (RDS) ---
            DB_ENGINE=${{ secrets.DB_ENGINE }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}

            # --- Cache & Celery (ElastiCache for Redis) ---
            CACHE_URL=${{ secrets.CACHE_URL }}
            CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}
            CELERY_RESULT_BACKEND=${{ secrets.CELERY_RESULT_BACKEND }}

            # --- Static Files (S3) ---
            AWS_STORAGE_BUCKET_NAME=${{ secrets.AWS_STORAGE_BUCKET_NAME }}

            # --- API & Service Keys ---
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            STRIPE_PUBLIC_KEY=${{ secrets.STRIPE_PUBLIC_KEY }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}

            # --- Email & Frontend ---
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}
            EOF

            # --- ROBUST DEPLOYMENT LOGIC ---

            IMAGE_NAME=${{ steps.build-image.outputs.image }}
            WEB_CONTAINER_NAME="web"
            WORKER_CONTAINER_NAME="worker"

            # Stop and remove the old worker container if it exists
            docker stop $WORKER_CONTAINER_NAME || true
            docker rm $WORKER_CONTAINER_NAME || true

            # Find and stop the container currently running on port 80, if any
            OLD_WEB_CONTAINER_ID=$(docker ps -q --filter "publish=80")
            if [ -n "$OLD_WEB_CONTAINER_ID" ]; then
                echo "--- Found old web container $OLD_WEB_CONTAINER_ID on port 80. Stopping it. ---"
                docker stop $OLD_WEB_CONTAINER_ID
            fi

            # --- CLEANUP SECTION ---
            # Clean up any stopped containers to prevent conflicts
            echo "--- Pruning stopped containers... ---"
            docker container prune -f

            # CRITICAL: Clean up old, unused images to save disk space
            echo "--- Pruning unused Docker images... ---"
            docker image prune -a -f

            # --- START NEW CONTAINERS ---
            # Start the new web container with the new image
            echo "--- Starting new web container ($WEB_CONTAINER_NAME)... ---"
            docker run -d --rm --env-file /home/ec2-user/.env.staging -p 80:8000 --name $WEB_CONTAINER_NAME $IMAGE_NAME gunicorn CEBackend.asgi:application -w 2 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000

            # Start the new celery worker container
            echo "--- Starting new worker container ($WORKER_CONTAINER_NAME)... ---"
            # ADDED --without-mingle and --without-gossip to make it compatible with ElastiCache Serverless
            docker run -d --rm --env-file /home/ec2-user/.env.staging --name $WORKER_CONTAINER_NAME $IMAGE_NAME celery -A CEBackend.celery worker -l info --without-mingle --without-gossip

            # --- NEW LOGGING SECTION ---

            # Give the containers a moment to initialize and start logging.
            echo "--- Waiting 5 seconds for containers to boot... ---"
            sleep 5

            echo "--- ✅ Deployment containers started. Tailing logs for 15 seconds... ---"

            # Use `docker logs --follow` with a timeout to stream logs for a short period.
            # The `&` runs the commands in the background. The `wait` command waits for them to finish.
            timeout 15s docker logs --follow $WEB_CONTAINER_NAME &
            timeout 15s docker logs --follow $WORKER_CONTAINER_NAME &
            wait

            echo "--- ✅ Log streaming complete. Deployment script finished. ---"
