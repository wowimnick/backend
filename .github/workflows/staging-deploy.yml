name: Deploy Staging to EC2

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: classeasily-backend-staging

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy to Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to EC2 instance
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USERNAME }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script: |
            # --- PREPARATION ---
            # Create the .env file from secrets
            cat << 'EOF' > /home/ec2-user/.env.staging
            # --- Meta ---
            IS_DOCKER=true
            DJANGO_ENV=staging

            # --- Core & Security ---
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DEBUG=False
            SITE_DOMAIN=${{ secrets.STAGING_EC2_HOST }}
            ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
            CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}
            SECURE_SSL_REDIRECT=${{ secrets.SECURE_SSL_REDIRECT }}

            # --- Database, Cache, S3, etc. ---
            DB_ENGINE=${{ secrets.DB_ENGINE }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            CACHE_URL=${{ secrets.CACHE_URL }}
            CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}
            CELERY_RESULT_BACKEND=${{ secrets.CELERY_RESULT_BACKEND }}
            AWS_STORAGE_BUCKET_NAME=${{ secrets.AWS_STORAGE_BUCKET_NAME }}
            AWS_S3_REGION_NAME=${{ secrets.AWS_S3_REGION_NAME }}
            CLOUDFRONT_DOMAIN=${{ secrets.CLOUDFRONT_DOMAIN }}

            # --- API & Service Keys (Including Stripe) ---
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            STRIPE_PUBLIC_KEY=${{ secrets.STRIPE_PUBLIC_KEY }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}

            # --- Email & Frontend ---
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}
            EOF

            TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
            INSTANCE_PRIVATE_IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4)
            INSTANCE_PUBLIC_IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/public-ipv4)
            sed -i "s/^ALLOWED_HOSTS=.*/ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }},$INSTANCE_PRIVATE_IP,$INSTANCE_PUBLIC_IP,localhost/" /home/ec2-user/.env.staging

            # --- DEPLOYMENT LOGIC ---
            IMAGE_NAME=${{ steps.build-image.outputs.image }}
            WEB_CONTAINER_NAME="web"
            WORKER_CONTAINER_NAME="worker"
            STRIPE_PAYMENTS_CONTAINER_NAME="stripe-cli-payments" # NEW: Specific name
            STRIPE_CONNECT_CONTAINER_NAME="stripe-cli-connect"   # NEW: Name for the second listener
            NETWORK_NAME="classeasily-net"
            ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}

            # 1. AUTHENTICATE & PULL
            echo "--- Logging into Amazon ECR... ---"
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY
            echo "--- Pulling new image: $IMAGE_NAME ---"
            docker pull $IMAGE_NAME

            # 2. SETUP DOCKER NETWORK
            echo "--- Ensuring Docker network '$NETWORK_NAME' exists... ---"
            docker network create $NETWORK_NAME || true

            # 3. STOP AND REMOVE OLD CONTAINERS
            echo "--- Stopping old containers... ---"
            docker stop $WEB_CONTAINER_NAME || true
            docker stop $WORKER_CONTAINER_NAME || true
            docker stop $STRIPE_PAYMENTS_CONTAINER_NAME || true # NEW: Stop specific container
            docker stop $STRIPE_CONNECT_CONTAINER_NAME || true  # NEW: Stop second container
            docker rm $WEB_CONTAINER_NAME || true
            docker rm $WORKER_CONTAINER_NAME || true
            docker rm $STRIPE_PAYMENTS_CONTAINER_NAME || true # NEW: Remove specific container
            docker rm $STRIPE_CONNECT_CONTAINER_NAME || true  # NEW: Remove second container

            # 4. START NEW APPLICATION CONTAINERS
            echo "--- Starting new web and worker containers... ---"
            docker run -d --env-file /home/ec2-user/.env.staging -p 80:8000 --name $WEB_CONTAINER_NAME --network $NETWORK_NAME $IMAGE_NAME gunicorn CEBackend.asgi:application -w 2 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000
            docker run -d --rm --env-file /home/ec2-user/.env.staging --name $WORKER_CONTAINER_NAME --network $NETWORK_NAME $IMAGE_NAME celery -A CEBackend.celery worker -l info --without-mingle --without-gossip

            # 5. START THE STRIPE CLI SIDECAR CONTAINERS (NOW TWO OF THEM!)
            echo "--- Starting Stripe CLI for Payments Webhook... ---"
            docker run -d --name $STRIPE_PAYMENTS_CONTAINER_NAME --network $NETWORK_NAME stripe/stripe-cli:latest \
              listen \
                --api-key "${{ secrets.STRIPE_SECRET_KEY }}" \
                --forward-to "http://web:8000/api/payments/webhook/" \
                --events "payment_intent.succeeded,payment_intent.payment_failed"

            echo "--- Starting Stripe CLI for Connect Webhook... ---"
            docker run -d --name $STRIPE_CONNECT_CONTAINER_NAME --network $NETWORK_NAME stripe/stripe-cli:latest \
              listen \
                --api-key "${{ secrets.STRIPE_SECRET_KEY }}" \
                --forward-to "http://web:8000/api/webhooks/stripe-connect/" \
                --events "account.updated,capability.updated,charge.refunded,payout.paid,payout.failed" # Example Connect events

              echo "--- Waiting 10 seconds for all containers to initialize... ---"
              sleep 10

              # 6. RUN POST-DEPLOYMENT WEBHOOK TESTS
              echo "--- 🧪 Running Webhook Verification Tests ---"

              # Test 1: Trigger a payment event
              echo "--- Triggering 'payment_intent.succeeded' event... ---"
              # ADD --api-key to make the command non-interactive
              docker exec $STRIPE_PAYMENTS_CONTAINER_NAME stripe trigger payment_intent.succeeded --api-key "${{ secrets.STRIPE_SECRET_KEY }}"
              sleep 2 # Give a moment for logs to appear

              # Test 2: Trigger a connect event
              echo "--- Triggering 'account.updated' event... ---"
              # ADD --api-key to make the command non-interactive
              docker exec $STRIPE_CONNECT_CONTAINER_NAME stripe trigger account.updated --api-key "${{ secrets.STRIPE_SECRET_KEY }}"
              sleep 2

              # 7. VERIFY TEST RESULTS BY CHECKING LOGS
              echo "--- Verifying test results... ---"

              # Check Payments Listener Log for a 200 OK response
              # `docker logs ... | grep ... || exit 1` means: search the logs, and if the pattern is not found, exit with an error code, failing the workflow.
              echo "--- Checking payments webhook log... ---"
              if docker logs $STRIPE_PAYMENTS_CONTAINER_NAME | grep -q "200 OK"; then
                  echo "✅ Payments webhook test PASSED."
              else
                  echo "❌ Payments webhook test FAILED. 200 OK not found in logs."
                  docker logs $STRIPE_PAYMENTS_CONTAINER_NAME # Print logs for debugging
                  exit 1
              fi

              # Check Connect Listener Log for a 200 OK response
              echo "--- Checking connect webhook log... ---"
              if docker logs $STRIPE_CONNECT_CONTAINER_NAME | grep -q "200 OK"; then
                  echo "✅ Connect webhook test PASSED."
              else
                  echo "❌ Connect webhook test FAILED. 200 OK not found in logs."
                  docker logs $STRIPE_CONNECT_CONTAINER_NAME # Print logs for debugging
                  exit 1
              fi

              # 8. FINAL CLEANUP
              echo "--- Pruning unused Docker images... ---"
              docker image prune -a -f
              echo "--- ✅ Deployment and Verification Successful. ---"
