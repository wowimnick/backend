[supervisord]
nodaemon=true
pidfile=/home/django/app/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0

[program:worker]
# ADDING --without-events FLAG AS THE FINAL GUARANTEE
command=celery -A CEBackend worker --loglevel=INFO --without-events
directory=/home/django/app
user=django
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:beat]
# Beat does not need this flag, but we'll add it for consistency.
command=celery -A CEBackend beat --loglevel=INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
directory=/home/django/app
user=django
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0