[supervisord]
nodaemon=true                   ; Run supervisord in the foreground (essential for containers)
logfile=/home/django/app/logs/supervisord.log ; Main log file
pidfile=/var/run/supervisord.pid

[program:worker]
command=celery -A CEBackend worker --loglevel=INFO
directory=/home/django/app      ; Set the working directory
user=django                     ; Run as the non-root user
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/home/django/app/logs/worker.log ; Capture stdout
stderr_logfile=/home/django/app/logs/worker_err.log ; Capture stderr - THIS IS KEY FOR DEBUGGING

[program:beat]
command=celery -A CEBackend beat --loglevel=INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
directory=/home/django/app
user=django
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/home/django/app/logs/beat.log
stderr_logfile=/home/django/app/logs/beat_err.log